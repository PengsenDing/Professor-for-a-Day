[project]
name = "professor-for-a-day-api"
version = "0.1.0"
description = "Professor-for-a-Day backend: FastAPI HTTP boundary over a LangChain LLM layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1.0",
  "uvicorn[standard]>=0.52,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.15,<3.0",
  "langchain>=1.3,<2.0",
  "langchain-core>=1.5,<2.0",
  "langchain-openai>=1.5,<2.0",
  "pymongo>=4.17,<5.0",
  "python-multipart>=0.0.20",
  "elevenlabs>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.9",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

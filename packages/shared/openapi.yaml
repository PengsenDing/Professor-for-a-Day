openapi: 3.1.0

info:
  title: Professor-for-a-Day Product API
  version: 0.2.0
  description: |
    Contract-first API for the Professor-for-a-Day MVP.

    This document is the authoritative agreement between the web frontend and the
    FastAPI backend (see docs/adr/0001-openapi-is-the-product-api-contract.md).
    The backend is verified against this file; generated output never redefines it.

    Scope: only the product routes the web app consumes. The legacy `/api/chat`
    and `/api/conversations` routes are intentionally excluded.

    Key design decisions:
    - Voice input is two-step: `POST /api/speech/transcriptions` turns audio into
      text, then the transcript is submitted through the ordinary text-turn
      contract with `input_mode: "voice"`. Transcription failures never touch a
      session.
    - Voice output is synthesize-on-fetch: JSON responses carry no audio. The
      client fetches `GET /api/sessions/{session_id}/turns/{turn_number}/speech`
      when it wants a reply spoken (see docs/adr/0003-speech-is-synthesized-on-fetch.md).
      Clients should cache fetched audio blobs for replay.
    - Errors use a minimal envelope `{"error": {"code", "message"}}` with an
      enumerated, provider-neutral `code`. Vendors, models, upstream statuses,
      and upstream error text never appear in a response.
    - Turn submissions are idempotent via a client-generated `client_turn_id`.
    - Hints are fetched on demand: `GET
      /api/sessions/{session_id}/turns/{turn_number}/hint` returns one
      learner-safe teaching hint for that AI Student statement. The hint is
      generated on first fetch, stored with the turn, and replayed on repeat
      fetches. Hints never affect Session Progress and never reveal rubric
      content, Judge reasoning, or the correct answer.
    - Sessions are resumable: `GET /api/sessions/{session_id}` returns a
      learner-safe snapshot of any session — active or ended — without invoking
      any provider (see docs/adr/0004-sessions-are-resumable-via-get.md). Judge
      evaluations and rubric internals never appear in the snapshot.
    - Mastery is browser-local and appears nowhere in this contract.
    - Knowledge graphs: the builtin `machine-learning` graph is version-controlled
      backend data; user graphs are created from freeform teaching sessions and
      grow append-only at session end (see
      docs/adr/0005-user-generated-knowledge-graphs.md). Rubric content never
      appears in graph responses.

# Anonymous by design: the MVP has no accounts or authentication (spec: Out of Scope).
# Provider credentials live server-side only and never reach this boundary.
security: []

servers:
  - url: http://127.0.0.1:8787
    description: Local development

tags:
  - name: system
    description: Process and dependency health.
  - name: graphs
    description: Knowledge graphs and their concept curricula. Never invokes an LLM.
  - name: sessions
    description: Teaching Session lifecycle — start, turns, finish, speech.
  - name: speech
    description: Speech-to-text for voice input.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Process and database health
      responses:
        "200":
          description: Health status. Never invokes an LLM or speech provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
                model: gemini-2.5-pro
                database: up

  /api/graphs:
    get:
      tags: [graphs]
      operationId: listGraphs
      summary: List knowledge graphs
      description: |
        Returns every knowledge graph: the builtin Machine Learning graph first,
        then user-created graphs oldest-first. No LLM call, no rubric content,
        no per-learner state.
      responses:
        "200":
          description: All knowledge graphs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphList"
              example:
                graphs:
                  - { id: machine-learning, title: Machine Learning, source: builtin, concept_count: 15, created_at: null }
                  - { id: 66bcd1f2a9c4e35d8f01a2b3, title: Compilers, source: user, concept_count: 6, created_at: "2026-08-15T09:30:00Z" }
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/graphs/{graph_id}:
    delete:
      tags: [graphs]
      operationId: deleteGraph
      summary: Delete a user-created knowledge graph
      description: |
        Permanently removes a user-created graph (its concepts, edges, and
        cached generated rubrics). The builtin `machine-learning` graph can
        never be deleted. Past Teaching Sessions and their reports are the
        learning record and are never touched by graph deletion.
      parameters:
        - $ref: "#/components/parameters/GraphId"
      responses:
        "204":
          description: The graph was deleted.
        "404":
          description: No such knowledge graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: GRAPH_NOT_FOUND, message: "No such knowledge graph." }
        "409":
          description: The builtin graph cannot be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: GRAPH_NOT_DELETABLE, message: "The builtin graph cannot be deleted." }
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/graphs/{graph_id}/curriculum:
    get:
      tags: [graphs]
      operationId: getGraphCurriculum
      summary: One graph's concepts and prerequisite edges
      description: |
        Returns the graph's Concepts and the directed prerequisite edges between
        them. The builtin graph is backend-owned, version-controlled data; user
        graphs are stored server-side and grow append-only at session end. No
        LLM call, no rubric content, no per-learner state. Edges are
        recommendations, never locks.
      parameters:
        - $ref: "#/components/parameters/GraphId"
      responses:
        "200":
          description: The graph's full curriculum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"
              example:
                concepts:
                  - { id: dataset, title: Dataset, summary: "A collection of examples used to teach or evaluate a model." }
                  - { id: features-and-labels, title: Features and Labels, summary: "The inputs a model sees and the answers it learns to predict." }
                  - { id: model, title: Model, summary: "A function with learnable parameters that maps features to predictions." }
                  - { id: training-vs-inference, title: Training vs. Inference, summary: "Learning parameters from data versus using them to predict." }
                  - { id: supervised-learning, title: Supervised Learning, summary: "Learning from examples that include the correct answer." }
                  - { id: unsupervised-learning, title: Unsupervised Learning, summary: "Finding structure in data without labeled answers." }
                  - { id: neural-networks, title: Neural Networks, summary: "Layered models that learn hierarchical representations." }
                  - { id: loss-function, title: Loss Function, summary: "A number that measures how wrong the model's predictions are." }
                  - { id: gradient-descent, title: Gradient Descent, summary: "Iteratively adjusting parameters downhill along the loss gradient." }
                  - { id: learning-rate, title: Learning Rate, summary: "The step size taken on each gradient descent update." }
                  - { id: overfitting, title: Overfitting, summary: "Memorizing training data at the cost of generalization." }
                  - { id: regularization, title: Regularization, summary: "Techniques that penalize complexity to improve generalization." }
                  - { id: train-validation-test-split, title: Train/Validation/Test Split, summary: "Separating data to train, tune, and honestly evaluate." }
                  - { id: confusion-matrix, title: Confusion Matrix, summary: "A table of prediction outcomes against true classes." }
                  - { id: precision-vs-recall, title: Precision vs. Recall, summary: "Two complementary views of a classifier's mistakes." }
                edges:
                  - { from: dataset, to: features-and-labels }
                  - { from: features-and-labels, to: model }
                  - { from: model, to: training-vs-inference }
                  - { from: training-vs-inference, to: supervised-learning }
                  - { from: training-vs-inference, to: unsupervised-learning }
                  - { from: supervised-learning, to: neural-networks }
                  - { from: model, to: loss-function }
                  - { from: loss-function, to: gradient-descent }
                  - { from: gradient-descent, to: learning-rate }
                  - { from: supervised-learning, to: overfitting }
                  - { from: overfitting, to: regularization }
                  - { from: overfitting, to: train-validation-test-split }
                  - { from: supervised-learning, to: confusion-matrix }
                  - { from: confusion-matrix, to: precision-vs-recall }
        "404":
          description: No such knowledge graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: GRAPH_NOT_FOUND, message: "No such knowledge graph." }
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a Teaching Session
      description: |
        Creates a session and returns the AI Student's opening question as text.
        The opening question is turn 0 for the speech endpoint. Every session
        starts at 0% with no cross-session carry-over.

        Two request shapes (exactly one):
        - `graph_id` + `concept_id`: teach an existing concept of an existing
          graph. A user-graph concept taught for the first time gets its rubric
          generated (and cached) during this call.
        - `topic`: freeform — teach a subject of your own. A rubric is generated
          for the topic and, when the session ends, the conversation is
          summarized into a new knowledge graph (`graph_update` on the ending
          envelope).

        If rubric generation or the AI Student call fails, no session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            examples:
              existing_concept:
                value:
                  graph_id: machine-learning
                  concept_id: gradient-descent
                  mode: confident
              freeform_topic:
                value:
                  topic: How compilers work
                  mode: beginner
      responses:
        "201":
          description: Session created; the AI Student has asked its opening question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
              example:
                session_id: 66bcd1f2a9c4e35d8f01a2b3
                graph_id: machine-learning
                concept: { id: gradient-descent, title: Gradient Descent }
                mode: confident
                student_text: "I read that gradient descent just tries random parameter values until the loss looks small. That's basically it, right?"
                progress: { percent: 0 }
                learner_turn_count: 0
                status: active
                active_misconception: null
        "422":
          description: Unknown graph or concept, invalid mode, or malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unknown_graph:
                  value: { error: { code: INVALID_GRAPH, message: "Unknown knowledge graph." } }
                unknown_concept:
                  value: { error: { code: INVALID_CONCEPT, message: "Unknown concept id." } }
                invalid_mode:
                  value: { error: { code: INVALID_MODE, message: "Mode must be beginner, confident, or skeptic." } }
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: Read a learner-safe session snapshot
      description: |
        Returns the current state of a Teaching Session — active or ended —
        rebuilt from stored data. Never invokes an LLM or speech provider and
        never mutates the session (AC-SES-7 / AC-SES-10, reinstated by
        ADR-0004).

        The snapshot carries the full ordered conversation (the opening
        question plus every learner/AI Student exchange) so a client can
        restore a session it no longer holds locally. It is a learner-safe
        projection: Judge evaluations, rubric internals, and probe
        recommendations never appear.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
              example:
                session_id: 66bcd1f2a9c4e35d8f01a2b3
                graph_id: machine-learning
                concept: { id: gradient-descent, title: Gradient Descent }
                mode: confident
                opening_text: "I read that gradient descent just tries random parameter values until the loss looks small. That's basically it, right?"
                turns:
                  - turn_number: 1
                    learner_transcript: "Gradient descent doesn't guess randomly. It computes the gradient of the loss with respect to each parameter and steps in the opposite direction."
                    input_mode: voice
                    student_text: "Okay, so the gradient tells us the direction. But then taking the biggest possible step each time must be fastest — why would anyone use small steps?"
                    newly_covered_points:
                      - { id: gd-1, label: "Uses the gradient of the loss" }
                      - { id: gd-2, label: "Steps opposite the gradient direction" }
                progress: { percent: 40 }
                active_misconception:
                  id: gd-mc-1
                  summary: "Believes the largest possible step size always converges fastest."
                learner_turn_count: 1
                status: active
                end_reason: null
                report: null
                graph_update: null
                created_at: "2026-08-15T09:30:00Z"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions/{session_id}/turns:
    post:
      tags: [sessions]
      operationId: submitTurn
      summary: Submit a learner explanation (one Teaching Turn)
      description: |
        Text-only JSON contract. Voice turns are transcribed first via
        `POST /api/speech/transcriptions` and submitted here with
        `input_mode: "voice"`.

        Orchestration is Judge-then-Student and atomic: either the full turn
        envelope is returned and the turn is persisted with its evaluation, or an
        error is returned and the session is left in its pre-turn state.

        Retries with the same `client_turn_id` return the original envelope
        without re-running the Judge, the AI Student, or the counters.

        A turn that reaches 100% ends the session in the same envelope
        (`status: "ended"` with a populated `report`); no extra request is
        needed. There is no turn limit: a session stays active until mastery
        or until the learner finishes it.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTurnRequest"
            example:
              learner_text: "Gradient descent doesn't guess randomly. It computes the gradient of the loss with respect to each parameter and steps in the opposite direction, because the gradient points uphill."
              input_mode: voice
              client_turn_id: 4f8b2c1e-9d3a-4e6b-8c7f-2a1d0e9b5c44
      responses:
        "200":
          description: The completed turn envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnEnvelope"
              examples:
                mid_session:
                  summary: Progress advanced, misconception now active
                  value:
                    turn_number: 1
                    learner_transcript: "Gradient descent doesn't guess randomly. It computes the gradient of the loss with respect to each parameter and steps in the opposite direction, because the gradient points uphill."
                    student_text: "Okay, so the gradient tells us the direction. But then taking the biggest possible step each time must be fastest — why would anyone use small steps?"
                    progress: { percent: 40 }
                    newly_covered_points:
                      - { id: gd-1, label: "Uses the gradient of the loss" }
                      - { id: gd-2, label: "Steps opposite the gradient direction" }
                    active_misconception:
                      id: gd-mc-1
                      summary: "Believes the largest possible step size always converges fastest."
                    learner_turn_count: 1
                    status: active
                    end_reason: null
                    report: null
                    graph_update: null
                mastery_reached:
                  summary: This turn reached 100% and ended the session
                  value:
                    turn_number: 3
                    learner_transcript: "A huge step can overshoot the minimum and even diverge. The learning rate controls step size, and iteration continues until the loss stops improving."
                    student_text: "That makes sense now — overshooting explains why my loss exploded. Thanks, teacher!"
                    progress: { percent: 100 }
                    newly_covered_points:
                      - { id: gd-4, label: "Iterates until convergence" }
                    active_misconception: null
                    learner_turn_count: 3
                    status: ended
                    end_reason: mastery
                    report:
                      final_percent: 100
                      explained_well:
                        - "Defined the gradient as the direction of steepest increase of the loss."
                        - "Explained stepping opposite the gradient to reduce loss."
                        - "Connected learning rate to step size and convergence."
                      misconceptions_corrected:
                        - "Largest step size is not fastest: overshooting and divergence."
                      gaps_and_accidental_implications: []
                      improvement_suggestion: "Add one concrete numeric example of a single parameter update to ground the algebra."
                      recommended_next_concept: { id: learning-rate, title: Learning Rate }
                      mastery_achieved: true
                    graph_update: null
                freeform_session_ended:
                  summary: A freeform session ended and created a knowledge graph
                  value:
                    turn_number: 8
                    learner_transcript: "So to recap: a compiler front end lexes and parses source into an AST before any optimization happens — and optimizations run on the intermediate representation afterwards."
                    student_text: "Ohh — I think I actually get it now. Thanks for teaching me!"
                    progress: { percent: 100 }
                    newly_covered_points:
                      - { id: compiler-stages, label: "Orders the compiler stages correctly" }
                    active_misconception: null
                    learner_turn_count: 8
                    status: ended
                    end_reason: mastery
                    report:
                      final_percent: 100
                      explained_well:
                        - "Distinguished lexing from parsing."
                        - "Placed optimization after the front end, on the intermediate representation."
                      misconceptions_corrected:
                        - "Optimization does not happen during parsing."
                      gaps_and_accidental_implications: []
                      improvement_suggestion: "Walk through one source line end to end, naming each compiler stage as it transforms the code."
                      recommended_next_concept: null
                      mastery_achieved: true
                    graph_update:
                      graph_id: 66bcd1f2a9c4e35d8f01a2b3
                      graph_title: Compilers
                      created: true
                      added_concepts:
                        - { id: how-compilers-work, title: How compilers work }
                        - { id: lexical-analysis, title: Lexical Analysis }
                        - { id: parsing, title: Parsing }
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "409":
          description: The session has already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: SESSION_ENDED, message: "This session has ended; start a new session to continue teaching." }
        "422":
          description: Empty, whitespace-only, or over-length learner text; invalid input_mode; malformed client_turn_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: EMPTY_SUBMISSION, message: "The explanation must not be empty." }
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions/{session_id}/turns/{turn_number}/speech:
    get:
      tags: [sessions]
      operationId: getTurnSpeech
      summary: Synthesize speech for one AI Student reply
      description: |
        Synthesizes the stored `student_text` of the given turn and returns the
        audio. The voice is resolved server-side from the session's AI Student
        mode — each mode speaks with its own configured character — and no
        request parameter can select a voice. `turn_number: 0` is the session's
        opening question.

        Synthesis happens on every fetch — nothing is cached or persisted
        server-side. Clients should cache the returned blob for replay. A muted
        client simply never calls this endpoint. Failures here never affect the
        session or the text flow.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TurnNumber"
      responses:
        "200":
          description: Synthesized speech audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown session, or the session has no such turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                session:
                  value: { error: { code: SESSION_NOT_FOUND, message: "No such session." } }
                turn:
                  value: { error: { code: TURN_NOT_FOUND, message: "The session has no such turn." } }
        "502":
          description: Speech synthesis failed. Non-blocking — the reply text remains usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: SPEECH_FAILED, message: "Speech synthesis is temporarily unavailable." }
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions/{session_id}/turns/{turn_number}/hint:
    get:
      tags: [sessions]
      operationId: getTurnHint
      summary: Get a teaching hint for one AI Student statement
      description: |
        Returns one short, learner-safe hint on how to respond to the stored
        AI Student statement of the given turn — a nudge about what to address
        or how to structure the explanation, never the explanation itself.
        `turn_number: 0` is the session's opening question.

        The hint is generated on the first fetch and stored with the turn, so
        repeat fetches replay the same hint without another language-model
        call. Requesting a hint never mutates session state otherwise: it does
        not create a turn, does not change Session Progress, and works on
        ended sessions. Hints never reveal rubric content, Judge reasoning, or
        the correct answer.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TurnNumber"
      responses:
        "200":
          description: The learner-safe hint for this turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnHint"
              example:
                turn_number: 2
                hint: "The student is stuck on why the step size matters — try walking through what happens to the update when the learning rate is very large versus very small."
        "404":
          description: Unknown session, or the session has no such turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                session:
                  value: { error: { code: SESSION_NOT_FOUND, message: "No such session." } }
                turn:
                  value: { error: { code: TURN_NOT_FOUND, message: "The session has no such turn." } }
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/sessions/{session_id}/finish:
    post:
      tags: [sessions]
      operationId: finishSession
      summary: Finish a Teaching Session early
      description: |
        Ends an active session (`end_reason: "learner_finished"`) and returns the
        Teacher Report — including at 0% progress. Idempotent: finishing an
        already-ended session returns the same stored report with its original
        `end_reason` and does not regenerate anything (including `graph_update`,
        which replays as stored and never re-summarizes).
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session is ended and the report is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFinished"
              example:
                session_id: 66bcd1f2a9c4e35d8f01a2b3
                status: ended
                end_reason: learner_finished
                progress: { percent: 60 }
                report:
                  final_percent: 60
                  explained_well:
                    - "Defined the gradient as the direction of steepest increase of the loss."
                    - "Explained stepping opposite the gradient to reduce loss."
                  misconceptions_corrected: []
                  gaps_and_accidental_implications:
                    - "The role of the learning rate was implied but never stated."
                  improvement_suggestion: "Explain what controls the size of each update step and what happens when it is too large."
                  recommended_next_concept: { id: learning-rate, title: Learning Rate }
                  mastery_achieved: false
                graph_update: null
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/speech/transcriptions:
    post:
      tags: [speech]
      operationId: transcribeAudio
      summary: Transcribe learner audio to text
      description: |
        Pure speech-to-text: accepts an audio upload, returns the transcript, and
        touches nothing else — no turn is created, no Judge or AI Student call is
        made, no session is mutated. The client submits the transcript through
        the ordinary turn contract with `input_mode: "voice"`. Uploaded audio is
        discarded after transcription and never persisted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: The recorded learner audio (e.g. webm/opus, wav, or mp3).
      responses:
        "200":
          description: The transcript of the uploaded audio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
              example:
                transcript: "Gradient descent computes the gradient of the loss and steps in the opposite direction."
        "413":
          description: Upload exceeds the configured size limit. Rejected before any provider call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: UPLOAD_TOO_LARGE, message: "The audio upload exceeds the size limit." }
        "415":
          description: Unsupported audio content type. Rejected before any provider call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: UNSUPPORTED_AUDIO_TYPE, message: "This audio format is not supported." }
        "502":
          description: Transcription failed upstream. The learner's session is untouched and text input remains usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: TRANSCRIPTION_FAILED, message: "Transcription is temporarily unavailable. You can type your explanation instead." }

components:
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      description: The knowledge-graph identifier from `GET /api/graphs`.
      schema:
        $ref: "#/components/schemas/GraphId"
    SessionId:
      name: session_id
      in: path
      required: true
      description: The anonymous Teaching Session identifier returned by `POST /api/sessions`.
      schema:
        type: string
        minLength: 1
    TurnNumber:
      name: turn_number
      in: path
      required: true
      description: The AI Student reply this operation targets. `0` is the opening question; `n` is the reply produced by learner turn `n`.
      schema:
        type: integer
        minimum: 0

  responses:
    SessionNotFound:
      description: Unknown or malformed session id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: { code: SESSION_NOT_FOUND, message: "No such session." }
    GenerationFailed:
      description: An upstream language-model call failed. Provider-neutral; the session is left in its pre-request state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: { code: GENERATION_FAILED, message: "The AI Student is temporarily unavailable. Please resubmit." }
    DatabaseUnavailable:
      description: The database is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: { code: DB_UNAVAILABLE, message: "The database is not available." }

  schemas:
    Health:
      type: object
      required: [ok, model, database]
      properties:
        ok:
          type: boolean
        model:
          type: string
          description: The configured default LLM model name.
        database:
          type: string
          enum: [up, down]

    GraphId:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Stable graph identifier. `machine-learning` is the builtin graph; user graphs use server-generated ids.

    GraphSource:
      type: string
      enum: [builtin, user]

    GraphSummary:
      type: object
      required: [id, title, source, concept_count, created_at]
      properties:
        id:
          $ref: "#/components/schemas/GraphId"
        title:
          type: string
        source:
          $ref: "#/components/schemas/GraphSource"
        concept_count:
          type: integer
          minimum: 1
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Null for the builtin graph, which predates the database.

    GraphList:
      type: object
      required: [graphs]
      properties:
        graphs:
          type: array
          items:
            $ref: "#/components/schemas/GraphSummary"

    GraphUpdate:
      type: object
      required: [graph_id, graph_title, created, added_concepts]
      properties:
        graph_id:
          $ref: "#/components/schemas/GraphId"
        graph_title:
          type: string
        created:
          type: boolean
          description: True when this session created the graph; false when it grew one.
        added_concepts:
          type: array
          items:
            $ref: "#/components/schemas/ConceptRef"
          description: All concepts of a newly created graph; only the appended ones for a grown graph. May be empty.

    Curriculum:
      type: object
      required: [concepts, edges]
      properties:
        concepts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Concept"
        edges:
          type: array
          description: Directed prerequisite recommendations. Acyclic; never locks a node.
          items:
            $ref: "#/components/schemas/PrerequisiteEdge"

    Concept:
      type: object
      required: [id, title, summary]
      properties:
        id:
          $ref: "#/components/schemas/ConceptId"
        title:
          type: string
        summary:
          type: string
          description: Short learner-facing description. Never contains rubric content.

    ConceptId:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Stable, URL-safe concept identifier (e.g. `gradient-descent`).

    ConceptRef:
      type: object
      required: [id, title]
      properties:
        id:
          $ref: "#/components/schemas/ConceptId"
        title:
          type: string

    PrerequisiteEdge:
      type: object
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/ConceptId"
        to:
          $ref: "#/components/schemas/ConceptId"

    Mode:
      type: string
      enum: [beginner, confident, skeptic]
      description: AI Student mode. Changes question style and depth only — never the rubric or the scoring standard.

    InputMode:
      type: string
      enum: [text, voice]

    SessionStatus:
      type: string
      enum: [active, ended]

    EndReason:
      type: string
      enum: [mastery, learner_finished, turn_limit]
      description: |
        `turn_limit` is legacy: sessions no longer have a turn budget, but
        sessions stored before the limit was removed still carry it.

    Progress:
      type: object
      required: [percent]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Session Progress derived from confirmed rubric coverage. Monotonic
            within a session. Capped at 99 while no misconception challenge has
            been posed or any posed challenge is unresolved.

    StartSessionRequest:
      type: object
      required: [mode]
      description: |
        Exactly one of (`graph_id` + `concept_id`) or `topic` must be provided.
      properties:
        graph_id:
          anyOf:
            - $ref: "#/components/schemas/GraphId"
            - type: "null"
          description: Required together with `concept_id`; omit for `topic` sessions.
        concept_id:
          anyOf:
            - $ref: "#/components/schemas/ConceptId"
            - type: "null"
        topic:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
          description: |
            Free-text subject to teach. The backend generates a rubric for it
            and, at session end, summarizes the conversation into a new
            knowledge graph.
        mode:
          $ref: "#/components/schemas/Mode"

    SessionCreated:
      type: object
      required:
        - session_id
        - graph_id
        - concept
        - mode
        - student_text
        - progress
        - learner_turn_count
        - status
        - active_misconception
      properties:
        session_id:
          type: string
        graph_id:
          anyOf:
            - $ref: "#/components/schemas/GraphId"
            - type: "null"
          description: Null for a `topic` session until its graph is created at session end.
        concept:
          $ref: "#/components/schemas/ConceptRef"
        mode:
          $ref: "#/components/schemas/Mode"
        student_text:
          type: string
          minLength: 1
          description: The AI Student's opening question. Fetch its audio at turn_number 0.
        progress:
          $ref: "#/components/schemas/Progress"
        learner_turn_count:
          type: integer
          const: 0
        status:
          type: string
          const: active
        active_misconception:
          type: "null"

    SubmitTurnRequest:
      type: object
      required: [learner_text, input_mode, client_turn_id]
      properties:
        learner_text:
          type: string
          minLength: 1
          maxLength: 8000
          description: The learner's explanation. For voice turns this is the transcript returned by the transcription endpoint.
        input_mode:
          $ref: "#/components/schemas/InputMode"
        client_turn_id:
          type: string
          format: uuid
          description: Client-generated idempotency key. Retries MUST reuse the same value.

    RubricPointRef:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: Stable rubric point id (e.g. `gd-2`).
        label:
          type: string
          description: Learner-safe label. Internal rubric descriptions never appear.

    ActiveMisconception:
      type: object
      required: [id, summary]
      properties:
        id:
          type: string
        summary:
          type: string
          description: Learner-safe statement of the misunderstanding being repaired. Never reveals the rubric's correction.

    TurnEnvelope:
      type: object
      required:
        - turn_number
        - learner_transcript
        - student_text
        - progress
        - newly_covered_points
        - active_misconception
        - learner_turn_count
        - status
        - end_reason
        - report
        - graph_update
      properties:
        turn_number:
          type: integer
          minimum: 1
        learner_transcript:
          type: string
          description: The learner text that was judged (echo of the submission).
        student_text:
          type: string
          minLength: 1
          description: The AI Student's follow-up question or plausible misunderstanding. Fetch its audio at this turn_number.
        progress:
          $ref: "#/components/schemas/Progress"
        newly_covered_points:
          type: array
          description: Rubric points confirmed on this turn only.
          items:
            $ref: "#/components/schemas/RubricPointRef"
        active_misconception:
          anyOf:
            - $ref: "#/components/schemas/ActiveMisconception"
            - type: "null"
        learner_turn_count:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/SessionStatus"
        end_reason:
          anyOf:
            - $ref: "#/components/schemas/EndReason"
            - type: "null"
          description: Null while active. `mastery` when this turn ended the session.
        report:
          anyOf:
            - $ref: "#/components/schemas/TeacherReport"
            - type: "null"
          description: Null while active; fully populated in the same envelope when the session ends.
        graph_update:
          anyOf:
            - $ref: "#/components/schemas/GraphUpdate"
            - type: "null"
          description: |
            Null while active, for builtin-graph sessions, and when graph
            persistence failed. Populated on the ending turn of `topic` and
            user-graph sessions. Idempotent retries replay the stored value.

    SessionFinished:
      type: object
      required: [session_id, status, end_reason, progress, report, graph_update]
      properties:
        session_id:
          type: string
        status:
          type: string
          const: ended
        end_reason:
          $ref: "#/components/schemas/EndReason"
        progress:
          $ref: "#/components/schemas/Progress"
        report:
          $ref: "#/components/schemas/TeacherReport"
        graph_update:
          anyOf:
            - $ref: "#/components/schemas/GraphUpdate"
            - type: "null"
          description: Same semantics as on `TurnEnvelope`.

    SnapshotTurn:
      type: object
      required:
        - turn_number
        - learner_transcript
        - input_mode
        - student_text
        - newly_covered_points
      properties:
        turn_number:
          type: integer
          minimum: 1
        learner_transcript:
          type: string
          description: The learner text that was judged.
        input_mode:
          $ref: "#/components/schemas/InputMode"
        student_text:
          type: string
          minLength: 1
          description: The AI Student's reply. Fetch its audio at this turn_number.
        newly_covered_points:
          type: array
          description: Rubric points confirmed on this turn only. Cumulative coverage is derivable client-side.
          items:
            $ref: "#/components/schemas/RubricPointRef"

    SessionSnapshot:
      type: object
      required:
        - session_id
        - graph_id
        - concept
        - mode
        - opening_text
        - turns
        - progress
        - active_misconception
        - learner_turn_count
        - status
        - end_reason
        - report
        - graph_update
        - created_at
      properties:
        session_id:
          type: string
        graph_id:
          anyOf:
            - $ref: "#/components/schemas/GraphId"
            - type: "null"
          description: Null for a `topic` session whose graph does not exist yet.
        concept:
          $ref: "#/components/schemas/ConceptRef"
        mode:
          $ref: "#/components/schemas/Mode"
        opening_text:
          type: string
          minLength: 1
          description: The AI Student's opening question. Fetch its audio at turn_number 0.
        turns:
          type: array
          description: Every accepted learner turn in order. Judge evaluations never appear.
          items:
            $ref: "#/components/schemas/SnapshotTurn"
        progress:
          $ref: "#/components/schemas/Progress"
        active_misconception:
          anyOf:
            - $ref: "#/components/schemas/ActiveMisconception"
            - type: "null"
        learner_turn_count:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/SessionStatus"
        end_reason:
          anyOf:
            - $ref: "#/components/schemas/EndReason"
            - type: "null"
          description: Null while active.
        report:
          anyOf:
            - $ref: "#/components/schemas/TeacherReport"
            - type: "null"
          description: Null while active; the stored Teacher Report once ended.
        graph_update:
          anyOf:
            - $ref: "#/components/schemas/GraphUpdate"
            - type: "null"
          description: Same semantics as on `TurnEnvelope`; replayed from storage.
        created_at:
          type: string
          format: date-time
          description: When the session was started.

    DemonstratedEvidence:
      type: object
      required: [point, quote, turn_number]
      properties:
        point:
          $ref: "#/components/schemas/RubricPointRef"
        quote:
          anyOf:
            - type: string
            - type: "null"
          description: |
            The learner's own words that demonstrated the point — surfaced only
            when the Judge's recorded evidence is a verbatim substring of that
            turn's submission; null otherwise. Never Judge or rubric text.
        turn_number:
          type: integer
          minimum: 1
          description: The learner turn in which the point was demonstrated.

    TeacherReport:
      type: object
      required:
        - final_percent
        - explained_well
        - misconceptions_corrected
        - gaps_and_accidental_implications
        - improvement_suggestion
        - recommended_next_concept
        - mastery_achieved
      properties:
        final_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Equals the session's final computed progress; never recomputed.
        explained_well:
          type: array
          items: { type: string }
          description: Grounded in this session's Judge evaluations only. May be empty.
        evidence:
          type: array
          description: |
            Why each point was scored: one entry per confirmed rubric point, in
            rubric order, citing the learner's own words where available. Not
            required so reports stored before this field existed stay valid;
            when absent, treat as empty.
          items:
            $ref: "#/components/schemas/DemonstratedEvidence"
        misconceptions_corrected:
          type: array
          items: { type: string }
        gaps_and_accidental_implications:
          type: array
          items: { type: string }
        improvement_suggestion:
          type: string
          minLength: 1
          description: Exactly one concrete, actionable suggestion. Always present, even at 0%.
        recommended_next_concept:
          anyOf:
            - $ref: "#/components/schemas/ConceptRef"
            - type: "null"
          description: Null when the graph has no other concept to recommend.
        mastery_achieved:
          type: boolean
          description: True if and only if final_percent is 100. Drives the accomplishment animation client-side.

    TurnHint:
      type: object
      required: [turn_number, hint]
      properties:
        turn_number:
          type: integer
          minimum: 0
          description: The AI Student turn this hint responds to. `0` is the opening question.
        hint:
          type: string
          minLength: 1
          description: |
            Learner-safe guidance on how to respond to this AI Student
            statement. Never rubric content, Judge reasoning, or the correct
            answer.

    Transcription:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string

    ErrorCode:
      type: string
      enum:
        - INVALID_GRAPH
        - INVALID_CONCEPT
        - INVALID_MODE
        - EMPTY_SUBMISSION
        - GRAPH_NOT_FOUND
        - GRAPH_NOT_DELETABLE
        - SESSION_NOT_FOUND
        - TURN_NOT_FOUND
        - SESSION_ENDED
        - TRANSCRIPTION_FAILED
        - GENERATION_FAILED
        - SPEECH_FAILED
        - UPLOAD_TOO_LARGE
        - UNSUPPORTED_AUDIO_TYPE
        - DB_UNAVAILABLE
        - VALIDATION_FAILED
      description: |
        Provider-neutral error codes. `VALIDATION_FAILED` is the fallback for
        request-shape errors not covered by a more specific code.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable, provider-neutral. Never names a vendor, model, upstream status, or upstream error text.
